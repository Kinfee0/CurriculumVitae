<!doctype html>
<!--
  Plantilla de la imagen Open Graph de cada nota del blog y página de servicio (1200x630).
  No se abre directo: scripts/generate-pages-og.mjs reemplaza {{KICKER}}, {{TITLE}} y
  {{TAGS}} por los datos de cada artículo y la rasteriza con Chrome.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0c0c;
        font-family: 'Kanit', sans-serif;
        color: #d7e2ea;
        position: relative;
      }

      .glow {
        position: absolute;
        border-radius: 9999px;
        filter: blur(110px);
      }

      .glow-1 {
        top: -200px;
        left: -160px;
        width: 620px;
        height: 620px;
        background: radial-gradient(circle, rgba(182, 0, 168, 0.45), transparent 70%);
      }

      .glow-2 {
        bottom: -260px;
        right: -120px;
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, rgba(118, 33, 176, 0.5), transparent 70%);
      }

      .content {
        position: relative;
        height: 100%;
        padding: 64px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .kicker {
        align-self: flex-start;
        padding: 10px 22px;
        border-radius: 9999px;
        background: rgba(215, 226, 234, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        font-size: 68px;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -0.015em;
        background: linear-gradient(180deg, #9aa1ad 0%, #eef6fb 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        max-width: 1000px;
      }

      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 0.04em;
      }

      .foot strong {
        font-weight: 500;
      }

      .tags {
        opacity: 0.65;
        text-transform: uppercase;
        font-size: 18px;
        letter-spacing: 0.16em;
      }
    </style>
  </head>
  <body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="content">
      <div class="kicker">{{KICKER}}</div>
      <h1>{{TITLE}}</h1>
      <div class="foot">
        <div><strong>Bastián Sandoval</strong> · bastiansandoval.cl</div>
        <div class="tags">{{TAGS}}</div>
      </div>
    </div>
  </body>
</html>
