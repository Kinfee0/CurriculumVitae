<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Generador de propuestas — Bastián Sandoval</title>
<!-- Plantilla del generador de propuestas. La genera scripts/propuestas.mjs
     con los precios y planes de src/servicios.ts; no editar el HTML de salida. -->
<style>
  @font-face { font-family: 'Kanit'; font-weight: 300; src: url('__FONTS__/kanit-latin-300.woff2') format('woff2'); }
  @font-face { font-family: 'Kanit'; font-weight: 400; src: url('__FONTS__/kanit-latin-400.woff2') format('woff2'); }
  @font-face { font-family: 'Kanit'; font-weight: 500; src: url('__FONTS__/kanit-latin-500.woff2') format('woff2'); }
  @font-face { font-family: 'Kanit'; font-weight: 900; src: url('__FONTS__/kanit-latin-900.woff2') format('woff2'); }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #16161d; --muted: #5b5f6b; --accent: #B600A8; --line: #e4e4ea; --soft: #f6f4f8; --dark: #0C0C0C; --silver: #D7E2EA; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: 'Kanit', sans-serif; color: var(--ink); font-weight: 300; font-size: 10.4pt; line-height: 1.5; background: #d9d9de; }
  strong { font-weight: 500; }

  /* Panel de datos (no se imprime) */
  .panel { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .panel h1 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
  .panel label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .panel input, .panel select, .panel textarea { width: 100%; margin-top: 3px; padding: 7px 9px; font: inherit; font-size: 13px; font-weight: 400; border: 1px solid #c9c9d2; border-radius: 8px; background: #fff; }
  .panel textarea { min-height: 38px; resize: vertical; }
  .panel .row { display: flex; gap: 10px; align-items: end; margin-top: 10px; flex-wrap: wrap; }
  .panel button { padding: 9px 18px; border: 0; border-radius: 99px; background: var(--accent); color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .panel .hint { font-size: 12px; color: var(--muted); }
  .sheets { padding: 20px 0 40px; }
  .page { width: 210mm; height: 297mm; margin: 0 auto 14px; position: relative; overflow: hidden; background: #fff; padding: 16mm 18mm 14mm; box-shadow: 0 4px 20px rgba(0,0,0,.18); }
  body.pdf { background: #fff; }
  body.pdf .panel { display: none; }
  body.pdf .sheets { padding: 0; }
  body.pdf .page { margin: 0; box-shadow: none; page-break-after: always; }
  body.pdf .page:last-child { page-break-after: auto; }
  @media print {
    body { background: #fff; }
    .panel { display: none; }
    .sheets { padding: 0; }
    .page { margin: 0; box-shadow: none; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
  }
  .ph { background: #fff3b0; border-radius: 3px; padding: 0 3px; }

  /* Portada / plan */
  .top { background: var(--dark); color: var(--silver); margin: -16mm -18mm 0; padding: 14mm 18mm 12mm; position: relative; overflow: hidden; }
  .top::before { content: ''; position: absolute; top: -40mm; left: -30mm; width: 120mm; height: 120mm; background: radial-gradient(circle, rgba(182,0,168,.42), transparent 70%); }
  .top::after { content: ''; position: absolute; bottom: -50mm; right: -30mm; width: 130mm; height: 130mm; background: radial-gradient(circle, rgba(118,33,176,.4), transparent 70%); }
  .top > * { position: relative; z-index: 1; }
  .kicker { text-transform: uppercase; letter-spacing: .2em; font-weight: 500; font-size: 8.2pt; color: #BBCCD7; }
  .top h1 { font-weight: 900; font-size: 27pt; line-height: 1.06; margin: 4mm 0 4mm; color: #eef3f7; }
  .top .lead { font-size: 10.6pt; color: #c8d4dd; max-width: 150mm; }
  .meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; margin-top: 7mm; }
  .meta small { display: block; text-transform: uppercase; letter-spacing: .16em; font-size: 7.4pt; color: #8d9aa6; }
  .meta span { font-weight: 500; font-size: 10.6pt; color: #fff; }
  h2 { font-weight: 900; font-size: 15pt; line-height: 1.1; margin-bottom: 3mm; }
  .eyebrow { text-transform: uppercase; letter-spacing: .2em; font-weight: 500; font-size: 7.8pt; color: var(--accent); margin-bottom: 1.5mm; }
  .plan { border: 1.5px solid var(--accent); border-radius: 14px; padding: 6mm 7mm; margin-top: 7mm; background: linear-gradient(180deg, #fff, #fbf3fb); }
  .plan .name { text-transform: uppercase; letter-spacing: .18em; font-weight: 500; font-size: 9pt; }
  .plan .price { font-weight: 900; font-size: 30pt; line-height: 1; margin: 2mm 0 1.5mm; color: var(--accent); }
  .plan .price small { font-weight: 300; font-size: 11pt; color: var(--muted); margin-left: 2mm; }
  .plan .sum { color: var(--muted); margin-bottom: 3mm; }
  ul.checks { list-style: none; margin: 0; }
  ul.checks li { position: relative; padding-left: 6mm; margin-bottom: 1.8mm; }
  ul.checks li::before { content: ''; position: absolute; left: 0; top: .5em; width: 3mm; height: 1.6mm; border-left: 1.6px solid #19a35a; border-bottom: 1.6px solid #19a35a; transform: rotate(-45deg); }
  .time { display: inline-block; margin-top: 2mm; font-size: 8.4pt; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; }
  .others { margin-top: 5mm; font-size: 9.4pt; color: var(--muted); }
  .others b { font-weight: 500; color: var(--ink); }

  /* Página 2 */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; margin: 3mm 0 7mm; }
  .tile { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 4mm; }
  .tile h4 { font-weight: 500; font-size: 10pt; margin-bottom: 1mm; }
  .tile p { font-size: 9.2pt; color: var(--muted); line-height: 1.4; }
  .steps { display: grid; gap: 3mm; margin-top: 2mm; }
  .step { display: grid; grid-template-columns: 11mm 1fr; gap: 3mm; align-items: start; }
  .step .n { font-weight: 900; font-size: 15pt; color: var(--accent); line-height: 1; }
  .step h4 { font-weight: 500; font-size: 10.4pt; }
  .step p { font-size: 9.4pt; color: var(--muted); }
  .need { margin-top: 6mm; border-left: 4px solid var(--accent); background: var(--soft); border-radius: 0 10px 10px 0; padding: 4mm 5mm; font-size: 9.6pt; }

  /* Página 3 */
  table { width: 100%; border-collapse: collapse; margin: 2mm 0 3mm; font-size: 9.6pt; }
  th, td { text-align: left; padding: 1.6mm 2.6mm; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; font-size: 8pt; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  td.v { white-space: nowrap; font-weight: 500; }
  td small { display: block; font-weight: 300; color: var(--muted); font-size: 8.6pt; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-top: 4mm; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 3mm 4.5mm; font-size: 9.4pt; }
  .card h4 { font-weight: 500; font-size: 10pt; margin-bottom: 1mm; }
  .card p { color: var(--muted); }
  .terms { margin-top: 4mm; font-size: 9pt; color: var(--muted); }
  .terms li { margin: 0 0 1mm 5mm; }
  .sign { position: absolute; left: 18mm; right: 18mm; bottom: 12mm; background: var(--dark); color: var(--silver); border-radius: 12px; padding: 5mm 7mm; display: flex; justify-content: space-between; gap: 6mm; font-size: 9.4pt; }
  .sign strong { color: #fff; }
  .sign .t { font-weight: 900; font-size: 13pt; color: #fff; margin-bottom: 1mm; }
</style>
</head>
<body>

<div class="panel">
  <h1>Generador de propuestas</h1>
  <div class="grid">
    <label>Servicio
      <select id="servicio"></select>
    </label>
    <label>Plan
      <select id="plan"></select>
    </label>
    <label>Cliente
      <input id="cliente" placeholder="Nombre del cliente" />
    </label>
    <label>Su negocio o rubro
      <input id="negocio" placeholder="empresa de topografía, pizzería…" />
    </label>
    <label>Fecha
      <input id="fecha" type="date" />
    </label>
    <label>Firma
      <select id="firma">
        <option>Bastián Sandoval y Valentina Fuica</option>
        <option>Bastián Sandoval</option>
        <option>Valentina Fuica</option>
      </select>
    </label>
    <label>Validez de la propuesta (opcional)
      <input id="validez" placeholder="Ej.: 15 días" />
    </label>
    <label>Nota para el cliente (opcional)
      <textarea id="nota" placeholder="Algo particular de este cliente"></textarea>
    </label>
  </div>
  <div class="row">
    <button id="imprimir" type="button">Guardar como PDF</button>
    <span class="hint">En la ventana de impresión: destino «Guardar como PDF», tamaño A4, márgenes «Ninguno» y activa «Gráficos de fondo».</span>
  </div>
</div>

<div class="sheets" id="sheets"></div>

<script>
const DATA = /*__DATA__*/ null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaLarga = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
const ph = (v, fallback) => (v && v.trim() ? esc(v.trim()) : `<span class="ph">${esc(fallback)}</span>`);

const params = new URLSearchParams(location.hash.replace(/^#/, ''));
const hoy = new Date(); const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// Selects
const sv = $('servicio'), pl = $('plan');
for (const [id, s] of Object.entries(DATA.services)) sv.add(new Option(s.label, id));
function fillPlans() {
  const s = DATA.services[sv.value]; const keep = pl.value;
  pl.innerHTML = '';
  s.plans.forEach((p, i) => pl.add(new Option(`${p.name} · ${p.price} + IVA`, String(i))));
  if (keep && pl.options[keep]) pl.value = keep;
}
fillPlans();
$('fecha').value = iso(hoy);

// Preset desde la URL (#servicio=menu-digital&plan=1&cliente=...&modo=pdf)
if (params.get('servicio') && DATA.services[params.get('servicio')]) { sv.value = params.get('servicio'); fillPlans(); }
if (params.get('plan')) pl.value = params.get('plan');
for (const k of ['cliente', 'negocio', 'validez', 'nota', 'firma']) if (params.get(k)) $(k).value = params.get(k);
if (params.get('fecha')) $('fecha').value = params.get('fecha');
if (params.get('modo') === 'pdf') document.body.classList.add('pdf');

function render() {
  const s = DATA.services[sv.value];
  const plan = s.plans[Number(pl.value)];
  const cliente = ph($('cliente').value, 'Nombre del cliente');
  const negocioTxt = $('negocio').value.trim();
  const negocio = ph(negocioTxt, 'negocio');
  const fecha = $('fecha').value ? fechaLarga($('fecha').value) : '';
  const others = s.plans.filter((p) => p !== plan).map((p) => `<b>${esc(p.name)}</b> ${esc(p.price)}`).join(' · ');
  const care = DATA.care;
  const tiles = DATA.tiles.map((t) => `<div class="tile"><h4>${esc(t[0])}</h4><p>${esc(t[1])}</p></div>`).join('');
  const steps = DATA.steps.map((t) => [t[0], t[1].split('{dias}').join(plan.days)]).map((t, i) => `<div class="step"><div class="n">0${i + 1}</div><div><h4>${esc(t[0])}</h4><p>${esc(t[1])}</p></div></div>`).join('');
  const rows = care.options.map((o) => `<tr><td><strong>${esc(o.name)}</strong><small>${esc(o.summary)}</small></td><td>${o.features.map(esc).join('<br>')}</td><td class="v">${esc(o.price)}<small>${esc(o.unit)}</small>${o.periods ? `<small>Trim. ${esc(o.periods.quarter)} · Anual ${esc(o.periods.year)}</small>` : ''}</td></tr>`).join('');
  const extra = [];
  if ($('validez').value.trim()) extra.push(`<li><strong>Validez de la propuesta:</strong> ${esc($('validez').value.trim())}</li>`);
  const nota = $('nota').value.trim() ? `<div class="need"><strong>Una nota para ti:</strong> ${esc($('nota').value.trim())}</div>` : '';

  $('sheets').innerHTML = `
  <section class="page">
    <div class="top">
      <div class="kicker">Presupuesto · ${esc(s.kicker)}</div>
      <h1>${esc(s.titulo)} para tu ${negocio}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <div class="meta">
        <div><small>Para</small><span>${cliente}</span></div>
        <div><small>Servicio</small><span>${esc(s.label)}</span></div>
        <div><small>Fecha</small><span>${esc(fecha)}</span></div>
        <div><small>Moneda</small><span>Pesos chilenos (CLP)</span></div>
      </div>
    </div>
    <div class="plan">
      <div class="eyebrow">Tu plan</div>
      <div class="name">${esc(plan.name)}</div>
      <div class="price">${esc(plan.price)}<small>+ IVA · pago único</small></div>
      <p class="sum">${esc(plan.summary)}</p>
      <ul class="checks">${plan.features.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
      <span class="time">${esc(plan.time)}</span>
    </div>
    <p class="others"><b>Otros planes de ${esc(s.noun)}:</b> ${others}. Cada plan incluye lo que ves arriba; te ayudo a elegir el que calza con lo que necesitas.</p>
    ${nota}
    <div class="need" style="margin-top:6mm">${esc(s.material)}</div>
  </section>

  <section class="page">
    <div class="eyebrow">Todos los planes incluyen</div>
    <h2>Lo que viene con tu ${esc(s.noun)}</h2>
    <div class="tiles">${tiles}</div>
    <div class="eyebrow">Modo de trabajo</div>
    <h2>Cómo lo hacemos</h2>
    <div class="steps">${steps}</div>
    <div class="need">${esc(DATA.garantia)}</div>
  </section>

  <section class="page">
    <div class="eyebrow">Después de la entrega</div>
    <h2>Alojamiento y cambios de contenido</h2>
    <p style="color:var(--muted)">${esc(care.intro)}</p>
    <table>
      <tr><th>Opción</th><th>Incluye</th><th>Valor + IVA</th></tr>
      ${rows}
    </table>
    <div class="two">
      <div class="card"><h4>Dominio</h4><p>${esc(DATA.dominio)}</p></div>
      <div class="card"><h4>Si prefieres llevártela</h4><p>${esc(DATA.llevarla)}</p></div>
    </div>
    <div class="two">
      <div class="card"><h4>Indexación en Google e IA (opcional)</h4><p>${esc(DATA.posicionamiento)}</p></div>
      <div class="card"><h4>Facturación</h4><p>${esc(DATA.factura)}</p></div>
    </div>
    <ul class="terms">
      ${DATA.terms.map((n) => `<li>${esc(n)}</li>`).join('')}
      ${extra.join('')}
    </ul>
    <div class="sign">
      <div><div class="t">Será un agrado trabajar contigo.</div>${esc($('firma').value)} · Desarrollo web full-stack</div>
      <div style="text-align:right">contacto@bastiansandoval.cl<br>bastiansandoval.cl<br>WhatsApp +56 9 4223 0004<br>Santiago, Chile</div>
    </div>
  </section>`;
  document.title = `Propuesta ${s.label} ${plan.name}${$('cliente').value.trim() ? ' - ' + $('cliente').value.trim() : ''}`;
}
sv.addEventListener('change', () => { fillPlans(); render(); });
['plan', 'cliente', 'negocio', 'fecha', 'firma', 'validez', 'nota'].forEach((id) => $(id).addEventListener('input', render));
$('imprimir').addEventListener('click', () => window.print());
render();
</script>
</body>
</html>
