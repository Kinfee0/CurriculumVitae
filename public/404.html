<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Bastián Sandoval</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0C0C0C" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0C0C0C; color: #D7E2EA; font-family: 'Kanit', sans-serif; line-height: 1.7; min-height: 100svh; display: flex; align-items: center; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px; text-align: center; }
    .code { font-weight: 900; line-height: 1; font-size: clamp(6rem, 30vw, 12rem); letter-spacing: -.03em; background: linear-gradient(180deg, #646973, #BBCCD7); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 8px 0 12px; }
    p { font-weight: 300; opacity: .7; margin-bottom: 32px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { color: inherit; text-decoration: none; text-transform: uppercase; letter-spacing: .15em; font-size: .85rem; font-weight: 500; border: 1px solid rgba(255,255,255,.14); background: rgba(215,226,234,.06); border-radius: 999px; padding: 12px 24px; transition: background .2s; }
    a:hover { background: rgba(215,226,234,.14); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code" aria-hidden="true">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. · This page doesn't exist.</p>
    <div class="links">
      <a href="/">Ir al portafolio</a>
      <a href="/blog/">Notas técnicas</a>
    </div>
  </main>
</body>
</html>
